    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Forecaster | FreeRate Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
<!-- Basic Favicon -->
<link rel="icon" type="image/png" href="https://i.ibb.co/WpjhbHKk/Smart-Select-20260321-154935-Chrome.jpg">

<!-- Shortcut Icon (for older browsers) -->

<!-- Apple Touch Icon -->

<!-- Android Chrome -->
<link rel="icon" sizes="192x192" href="https://i.ibb.co/WpjhbHKk/Smart-Select-20260321-154935-Chrome.jpg">
<link rel="icon" sizes="512x512" href="https://i.ibb.co/WpjhbHKk/Smart-Select-20260321-154935-Chrome.jpg">

<!-- Theme Color (Mobile Browser UI color) -->
<meta name="theme-color" content="#0d1117">
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold">FR</div>
                <span class="text-2xl font-extrabold tracking-tighter">FreeRate</span>
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-16">
        <div class="grid lg:grid-cols-2 gap-12 items-center">
            <div>
                <h1 class="text-5xl font-black mb-6">Plan Your <span class="text-indigo-600">Scale.</span></h1>
                <p class="text-slate-500 mb-8">Stop working month-to-month. Set your annual target and see the roadmap to get there.</p>
                
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <label class="block text-xs font-black uppercase text-slate-400 mb-2">Annual Income Goal ($)</label>
                        <input type="number" id="annualGoal" value="100000" oninput="forecast()" class="w-full text-3xl font-black border-none focus:ring-0">
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <label class="block text-xs font-black uppercase text-slate-400 mb-2">Average Project Price ($)</label>
                        <input type="number" id="avgProject" value="2500" oninput="forecast()" class="w-full text-3xl font-black border-none focus:ring-0">
                    </div>
                </div>
            </div>

            <div class="bg-indigo-600 rounded-[3rem] p-12 text-white">
                <div class="space-y-10">
                    <div>
                        <p class="text-indigo-200 text-xs font-bold uppercase tracking-[0.2em] mb-2">Monthly Target</p>
                        <h2 id="monthlyTarget" class="text-5xl font-black">$8,333</h2>
                    </div>
                    <div class="pt-10 border-t border-indigo-400/30">
                        <p class="text-indigo-200 text-xs font-bold uppercase tracking-[0.2em] mb-4">Required Sales</p>
                        <div class="flex items-end gap-2">
                            <span id="projectsNeeded" class="text-6xl font-black">40</span>
                            <span class="text-indigo-200 font-bold mb-2">Projects / Year</span>
                        </div>
                        <p id="monthlyProjects" class="mt-4 text-indigo-100 italic">That's roughly 3.3 projects per month.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 text-white py-12 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest leading-loose">
                FreeRate Suite: 9 Tools for the Modern Professional<br>
                &copy; 2026 Independent Work Hub
            </p>
        </div>
    </footer>

    <script>// Example: if 'annualGoal' is the target
saveToHistory("Revenue Goal", `Target set to $${annualGoal}/year`);

        function forecast() {
            const annual = parseFloat(document.getElementById('annualGoal').value) || 0;
            const price = parseFloat(document.getElementById('avgProject').value) || 1;
            
            const monthly = annual / 12;
            const projects = annual / price;
            
            document.getElementById('monthlyTarget').innerText = '$' + Math.round(monthly).toLocaleString();
            document.getElementById('projectsNeeded').innerText = Math.round(projects);
            document.getElementById('monthlyProjects').innerText = "That's roughly " + (projects / 12).toFixed(1) + " projects per month.";
        }
        window.onload = forecast;
    </script>
</body>
</html>
