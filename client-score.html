<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Value Scorecard | FreeRate Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold">FR</div>
                <span class="text-2xl font-extrabold tracking-tighter">FreeRate</span>
            </a>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Tool #8: Client Auditor</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black mb-4">Client <span class="text-indigo-600">Value</span> Scorecard</h1>
            <p class="text-slate-500">Is your client a partner or a drain? Use data to decide.</p>
        </div>

        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-slate-200">
            <div class="space-y-8">
                <div>
                    <label class="block font-bold mb-3">1. Profitability: Does the pay match the effort?</label>
                    <input type="range" id="q1" min="1" max="10" value="5" oninput="auditClient()" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 mt-2 uppercase"><span>Underpaid</span><span>High Margin</span></div>
                </div>
                <div>
                    <label class="block font-bold mb-3">2. Communication: Are they clear and respectful?</label>
                    <input type="range" id="q2" min="1" max="10" value="5" oninput="auditClient()" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 mt-2 uppercase"><span>Toxic/Vague</span><span>Perfect Clarity</span></div>
                </div>
                <div>
                    <label class="block font-bold mb-3">3. Payment Speed: Do they pay on time?</label>
                    <input type="range" id="q3" min="1" max="10" value="5" oninput="auditClient()" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 mt-2 uppercase"><span>Always Late</span><span>Instant Pay</span></div>
                </div>
            </div>

            <div class="mt-12 p-10 bg-slate-900 rounded-3xl text-center">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Audit Verdict</p>
                <div id="scoreDisplay" class="text-6xl font-black text-white mb-4">15/30</div>
                <p id="verdictText" class="text-indigo-400 font-bold">Average client. Room for improvement.</p>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 text-white py-12 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center border-t border-slate-900 pt-10">
            <p class="text-slate-600 text-[10px] font-black uppercase tracking-[0.3em]">Optimizing Freelance Relationships &copy; 2026</p>
        </div>
    </footer>

    <script>// Example: if 'clientGrade' is the result (e.g., "A+")
saveToHistory("Client Score", `Graded ${clientName} as ${clientGrade}`);

        function auditClient() {
            const s1 = parseInt(document.getElementById('q1').value);
            const s2 = parseInt(document.getElementById('q2').value);
            const s3 = parseInt(document.getElementById('q3').value);
            const total = s1 + s2 + s3;
            
            document.getElementById('scoreDisplay').innerText = total + "/30";
            
            const v = document.getElementById('verdictText');
            if(total >= 25) { v.innerText = "⭐ Dream Client: Prioritize them!"; v.className = "text-emerald-400 font-bold"; }
            else if(total >= 15) { v.innerText = "⚖️ Solid Client: Keep the relationship steady."; v.className = "text-indigo-400 font-bold"; }
            else { v.innerText = "🚩 Red Flag: Consider firing or raising rates."; v.className = "text-rose-400 font-bold"; }
        }
    </script>
</body>
</html>
